name: release

# 打 v* 标签时自动构建 Windows 便携版，并发布到 GitHub Releases。
# 配了 GITEE_TOKEN 之后，同一次构建还会同步到 Gitee 发行版。
#
# 需要的配置：
#   仓库 → Settings → Secrets and variables → Actions
#     GITEE_TOKEN = 你的 Gitee 私人令牌（projects 权限）——可选，不配就只发 GitHub
#
# 手动触发：Actions → release → Run workflow，填一个 tag（例如 v0.1.0）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发行版标签，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node（npm pack 拉取桌面小人素材）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 拉取 dafeiyu 桌面小人（含 spin 补丁）
        shell: powershell
        run: ./scripts/fetch_visual.ps1 -Python (Get-Command python).Source

      - name: 单元测试
        run: python -m pytest -q

      - name: 打包便携版并生成发行包
        shell: powershell
        run: ./scripts/release.ps1 -NoUpload -NoTag -Python (Get-Command python).Source

      - name: 生成校验和
        shell: powershell
        run: |
          Get-ChildItem dist/release/*.zip | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/release/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/release/SHA256SUMS.txt

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 弹幕小人 ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步到 Gitee 发行版（可选）
        shell: powershell
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if (-not $env:GITEE_TOKEN) {
            Write-Host "没有配置 GITEE_TOKEN，跳过 Gitee 同步"
            exit 0
          }
          ./scripts/release.ps1 -SkipBuild -NoTag -Python (Get-Command python).Source -Tag $env:RELEASE_TAG
